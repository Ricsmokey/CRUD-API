services:
  api:
    build: .
    ports:
      - "8003:8000"
    environment:
      DATABASE_URL: postgresql://postgres:hushmoney02@db:5432/tasksdb
    depends_on:
      - db

  db:
    image: postgres:16
    environment:
      POSTGRES_PASSWORD: hushmoney02
      POSTGRES_DB: tasksdb
    volumes:
      - taskdata:/var/lib/postgresql/data

volumes:
  taskdata: